    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;

      --bg: #f8fafc;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --badge-bg: #f1f5f9;
      --badge-text: #334155;
      --badge-hover: #e2e8f0;
      --highlight-border: #3b82f6;
      --highlight-bg: #eff6ff;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }

    html.dark {
      --bg: #0b0f19;
      --bg-card: #131b2e;
      --border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: #172554;
      --badge-bg: #1e293b;
      --badge-text: #cbd5e1;
      --badge-hover: #334155;
      --highlight-border: #60a5fa;
      --highlight-bg: #1e293b;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.4);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Showcase Bar */
    .showcase-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .showcase-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .showcase-pill {
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary);
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .showcase-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .showcase-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .showcase-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .showcase-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-pill-group {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
    }

    .toggle-pill-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .toggle-pill-btn.active {
      background: var(--bg-card);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .icon-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      border-color: var(--primary);
    }

    /* Container */
    .container {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .resume-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      box-shadow: var(--shadow);
    }

    /* Header Profile */
    header.profile {
      display: flex;
      gap: 28px;
      align-items: flex-start;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .profile-info {
      flex: 1;
    }

    .profile-info h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
    }

    .profile-info .title {
      font-size: 18px;
      font-weight: 600;
      color: var(--primary);
      margin-top: 4px;
    }

    .profile-info .summary {
      font-size: 14.5px;
      color: var(--text-muted);
      margin-top: 10px;
      line-height: 1.5;
    }

    .contact-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      margin-top: 14px;
      font-size: 13.5px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .chip:hover {
      color: var(--primary);
    }

    /* Sections */
    section {
      margin-top: 32px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Timeline Experiences */
    .timeline {
      position: relative;
      padding-left: 20px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: var(--border);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 26px;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -25px;
      top: 22px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--primary);
    }

    .timeline-item.highlighted {
      background: var(--highlight-bg);
      border-color: var(--highlight-border);
      box-shadow: var(--shadow-sm);
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
    }

    .role-company {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .role-company .company {
      color: var(--primary);
      font-weight: 600;
    }

    .period {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .job-summary {
      font-size: 13.5px;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .job-bullets {
      margin-top: 8px;
      padding-left: 18px;
      font-size: 14px;
      color: var(--text);
    }

    .job-bullets li {
      margin-bottom: 6px;
    }

    /* Education Grid */
    .education-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .edu-card {
      padding: 14px 18px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
    }

    .edu-main {
      font-size: 15px;
      font-weight: 600;
    }

    .edu-sub {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Skills Grid */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 18px;
    }

    .skill-category {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .skill-cat-title {
      font-size: 13.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .skill-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .skill-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      padding: 4px 9px;
      border-radius: 6px;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid transparent;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .skill-badge:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--badge-hover);
    }

    .skill-badge.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }

    /* Two-column Footer: Languages & Interests */
    .extra-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .extra-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .extra-card h3 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .extra-card ul {
      list-style-type: disc;
      padding-left: 18px;
      font-size: 14px;
      color: var(--text);
    }

    .extra-card li {
      margin-bottom: 5px;
    }

    /* Print Styles */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 10.5pt;
        line-height: 1.4;
      }

      .showcase-bar {
        display: none !important;
      }

      .container {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .resume-card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }

      header.profile {
        border-bottom: 2px solid #2563eb !important;
        padding-bottom: 14pt;
      }

      .avatar {
        width: 80px;
        height: 80px;
      }

      .profile-info h1 {
        font-size: 22pt;
      }

      .profile-info .title {
        font-size: 13pt;
        color: #2563eb !important;
      }

      .section-title {
        color: #2563eb !important;
        margin-top: 14pt;
        margin-bottom: 8pt;
        font-size: 12pt;
      }

      .timeline-item {
        padding: 4pt 0 !important;
        margin-bottom: 10pt !important;
        break-inside: avoid;
      }

      .timeline-item::before,
      .timeline::before {
        display: none !important;
      }

      .timeline {
        padding-left: 0 !important;
      }

      .skill-category,
      .extra-card,
      .edu-card {
        background: transparent !important;
        border: 1px solid #e2e8f0 !important;
        break-inside: avoid;
      }

      .skill-badge {
        background: #f1f5f9 !important;
        color: #0f172a !important;
        border: 1px solid #cbd5e1 !important;
      }

      a {
        color: inherit !important;
        text-decoration: none !important;
      }
    }

    @media (max-width: 768px) {
      .resume-card {
        padding: 24px 18px;
      }

      header.profile {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .contact-chips {
        justify-content: center;
      }

      .skills-grid,
      .extra-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <script>
    let currentLang = 'fr';
    let selectedSkill = null;
    let resumeData = {
      fr: JSON.parse(document.getElementById('data-fr').textContent),
      en: JSON.parse(document.getElementById('data-en').textContent)
    };

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      selectedSkill = null;
      renderResume();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      document.getElementById('theme-toggle').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Initialize Theme Preference
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      document.getElementById('theme-toggle').textContent = '☀️';
    }

    function toggleSkill(skill) {
      if (selectedSkill === skill) {
        selectedSkill = null;
      } else {
        selectedSkill = skill;
      }
      renderResume();
    }

    function renderResume() {
      const data = resumeData[currentLang];
      const c = data.basics;

      let html = `
        <header class="profile">
          <div class="avatar-wrapper">
            <img class="avatar" src="${c.image || 'photo_kds.png'}" alt="${c.name}" onerror="this.style.display='none'">
          </div>
          <div class="profile-info">
            <h1>${c.name}</h1>
            <div class="title">${c.label}</div>
            <p class="summary">${c.summary || ''}</p>
            <div class="contact-chips">
              <a href="mailto:${c.email}" class="chip"><span>✉️</span> ${c.email}</a>
              <a href="tel:${c.phone.replace(/\\s/g, '')}" class="chip"><span>📞</span> ${c.phone}</a>
              <span class="chip"><span>📍</span> ${c.location.city}, ${c.location.countryCode}</span>
              ${c.url ? `<a href="${c.url}" target="_blank" class="chip"><span>🔗</span> ${c.url.replace('https://', '')}</a>` : ''}
            </div>
          </div>
        </header>

        <!-- Experience Section -->
        <section id="experience">
          <h2 class="section-title">${currentLang === 'fr' ? 'Expériences Professionnelles' : 'Professional Experience'}</h2>
          <div class="timeline">
      `;

      data.work.forEach(job => {
        const periodStr = `${job.startDate} — ${job.endDate ? job.endDate : (currentLang === 'fr' ? 'Présent' : 'Present')}`;
        
        // Check if job matches selected skill filter
        let isHighlighted = false;
        if (selectedSkill) {
          const lowerSkill = selectedSkill.toLowerCase();
          const jobText = (job.summary + ' ' + (job.highlights || []).join(' ') + ' ' + job.position).toLowerCase();
          if (jobText.includes(lowerSkill)) {
            isHighlighted = true;
          }
        }

        html += `
          <div class="timeline-item ${isHighlighted ? 'highlighted' : ''}">
            <div class="timeline-header">
              <div class="role-company">
                ${job.position} <span style="font-weight: normal; color: var(--text-muted)">•</span> 
                <span class="company">${job.name}</span>
              </div>
              <div class="period">${periodStr}</div>
            </div>
            ${job.summary ? `<div class="job-summary">${job.summary}</div>` : ''}
            ${job.highlights && job.highlights.length ? `
              <ul class="job-bullets">
                ${job.highlights.map(h => `<li>${h}</li>`).join('')}
              </ul>
            ` : ''}
          </div>
        `;
      });

      html += `
          </div>
        </section>

        <!-- Education Section -->
        <section id="education">
          <h2 class="section-title">${currentLang === 'fr' ? 'Formation' : 'Education'}</h2>
          <div class="education-grid">
      `;

      data.education.forEach(edu => {
        const dateStr = edu.startDate === edu.endDate || !edu.endDate ? edu.startDate : `${edu.startDate} — ${edu.endDate}`;
        html += `
          <div class="edu-card">
            <div>
              <div class="edu-main">${edu.studyType} — <span style="color: var(--primary); font-weight: 600;">${edu.institution}</span></div>
              <div class="edu-sub">${edu.area || ''} ${edu.score ? `• <em>${edu.score}</em>` : ''}</div>
              ${edu.courses && edu.courses.length ? `<div class="edu-sub" style="font-style: italic;">${edu.courses.join(' • ')}</div>` : ''}
            </div>
            <div class="period">${dateStr}</div>
          </div>
        `;
      });

      html += `
          </div>
        </section>

        <!-- Skills Section with Interactive Tags -->
        <section id="skills">
          <h2 class="section-title">${currentLang === 'fr' ? 'Compétences Techniques (cliquez pour filtrer)' : 'Technical Skills (click to filter)'}</h2>
          <div class="skills-grid">
      `;

      data.skills.forEach(cat => {
        html += `
          <div class="skill-category">
            <div class="skill-cat-title">${cat.name}</div>
            <div class="skill-badges">
              ${cat.keywords.map(kw => `
                <button class="skill-badge ${selectedSkill === kw ? 'active' : ''}" onclick="toggleSkill('${kw}')">
                  ${kw}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      });

      html += `
          </div>
        </section>

        <!-- Languages & Interests Grid -->
        <section id="extra">
          <div class="extra-grid">
            <div class="extra-card">
              <h3>${currentLang === 'fr' ? 'Langues' : 'Languages'}</h3>
              <ul>
                ${data.languages.map(l => `<li><strong>${l.language} :</strong> ${l.fluency}</li>`).join('')}
              </ul>
            </div>
            <div class="extra-card">
              <h3>${currentLang === 'fr' ? 'Centres d’intérêt' : 'Interests'}</h3>
              <ul>
                ${data.interests.map(i => `<li><strong>${i.name}</strong> ${i.keywords && i.keywords.length ? `(${i.keywords.join(', ')})` : ''}</li>`).join('')}
              </ul>
            </div>
          </div>
        </section>
      `;

      document.getElementById('resume-container').innerHTML = html;
    }

    // Initial render
    renderResume();
  </script>
